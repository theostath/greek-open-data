[project]
name = "pythia"
version = "0.0.0"
description = "Natural-language query assistant over the Greek open-data portal (data.gov.gr)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "charset-normalizer>=3.3",
    "tenacity>=8.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "truststore>=0.9",
    "pyyaml>=6.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.48.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[project.scripts]
# `uv run pythia-dev` starts the app with a readable preflight. Exists because `make` is not
# available on every dev box here, and the Makefile target is a one-line wrapper around this.
pythia-dev = "pythia.api.dev:main"

[tool.uv]
# This environment terminates TLS with a custom root CA (corporate proxy); use the OS trust
# store so uv can reach PyPI. Renamed from `native-tls` in uv 0.11, which deprecated it.
system-certs = true

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pythia"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *is* a call in an argument default; B008 is a real warning
# everywhere else, so the exemption is listed per-callable rather than disabling the rule.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
files = ["src", "config.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["charset_normalizer.*", "truststore.*", "chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
